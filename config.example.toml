# Copy to config.local.toml (gitignored) and edit.

data_dir = "data"
out_dir = "out"
target_lang = "ja"
gloss_langs = ["zh-Hant", "en"]

[tokenizer]
plugin = "vocab_miner.tokenizers.ja:JapaneseTokenizer"

[romanizer]
plugin = "vocab_miner.tokenizers.ja:HepburnRomanizer"
macrons = false          # とうきょう -> toukyou

[examples]
per_entry = 3
exclude_tags = ["spoiler"]

# One [[sources]] block per material. Public sources shown; private ones use private.sources.xxx:Class
[[sources]]
id = "demo/text"
plugin = "vocab_miner.sources.text:TextSource"
path = "tests/fixtures/ja_sample.txt"
lang = "ja"

split = "line"            # line / paragraph / sentence

