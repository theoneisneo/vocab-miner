[project]
name = "vocab-miner"
version = "0.0.1"
description = "Build frequency-ranked vocabulary lists and example-sentence cards from the media you are actually consuming."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
ja = ["fugashi>=1.3", "unidic-lite>=1.0.8"]
en = [
    "spacy>=3.8,<3.9",
    "en-core-web-sm",                  # spaCy model, not on PyPI: see [tool.uv.sources]
]
anki = ["genanki>=0.13"]
whisper = [
    "faster-whisper>=1.1",
    "av>=11,<16",                     # faster-whisper 1.2 does not work with PyAV 16+
    # CUDA libraries for the GPU (Windows/Linux); without a GPU Whisper runs on the CPU
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

# vocal separation before Whisper (vm transcribe --separate); GPU PyTorch from PyTorch's index, see [tool.uv.sources]
separate = ["demucs>=4.0", "torch>=2.5", "torchaudio>=2.5"]

[project.scripts]
vm = "vocab_miner.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_miner"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
# project root on sys.path so plugins under private/ (gitignored) are importable in their own tests
pythonpath = ["."]
