[project]
name = "vocab-miner"
version = "0.0.1"
description = "Build frequency-ranked vocabulary lists and example-sentence cards from the media you are actually consuming."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
ja = ["fugashi>=1.3", "unidic-lite>=1.0.8", "cutlet>=0.4"]
anki = ["genanki>=0.13"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
vm = "vocab_miner.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocab_miner"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
# project root on sys.path so plugins under private/ (gitignored) are importable in their own tests
pythonpath = ["."]
